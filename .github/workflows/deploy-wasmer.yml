name: Deploy to Wasmer Edge

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Project
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://khrrcfdnrzwjqbnskshf.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_aDsSXKOQykl72HvXUie5vg_eu_O68cC' }}

      - name: Setup Wasmer CLI
        uses: wasmerio/setup-wasmer@v3.1

      - name: Deploy to Wasmer Edge
        run: wasmer deploy --non-interactive
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
